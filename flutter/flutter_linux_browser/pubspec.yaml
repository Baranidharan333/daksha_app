name: daksha
description: A lightweight tabbed web browser built with Flutter for Linux desktop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/daksha-mini.jpg
    - assets/daksha-head.png
    - assets/ihub-robotics-logo.jpg

# Local copy patched for WPE WebKit 2.54 (see third_party/flutter_inappwebview_linux).
dependency_overrides:
  flutter_inappwebview_linux:
    path: third_party/flutter_inappwebview_linux
