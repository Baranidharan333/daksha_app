<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Robot</title>
  <!-- Required on every gated page: renews the session through the Daksha app. -->
  <script src="/static/daksha-config.js"></script>
  <script src="/static/daksha-session.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #e6e9f2; margin: 0; padding: 24px; }
    h1 { margin-top: 0; }
    section { background: #141b2d; border: 1px solid #394767; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    pre { background: #0b1020; padding: 12px; border-radius: 8px; overflow: auto; }
    button, input { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #394767; background: #202941; color: inherit; }
    a { color: #b8acff; }
  </style>
</head>
<body>
  <h1>Demo robot dashboard</h1>
  <p>If you can read this, the gateway accepted your session.</p>

  <section>
    <h2>Protected API</h2>
    <button id="status">GET /api/status</button>
    <pre id="status-out">–</pre>
  </section>

  <section>
    <h2>WebSocket</h2>
    <input id="msg" value="hello robot"> <button id="send">Send</button>
    <pre id="ws-out">connecting…</pre>
  </section>

  <section>
    <h2>Logs</h2>
    <a href="/logs" target="_blank">Open logs in a new tab</a>
  </section>

  <section>
    <h2>Session</h2>
    <button id="logout">Log out (POST /_gate/logout)</button>
    <p>After logging out, press the app's Reload: it gets a new ticket and signs in again.</p>
  </section>

  <script>
    var statusOut = document.getElementById('status-out');
    document.getElementById('status').onclick = function () {
      fetch('/api/status').then(function (r) {
        return r.ok ? r.json().then(function (j) { statusOut.textContent = JSON.stringify(j, null, 2); })
                    : (statusOut.textContent = 'HTTP ' + r.status);
      });
    };

    var wsOut = document.getElementById('ws-out');
    var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = function () { wsOut.textContent = 'connected'; };
    ws.onmessage = function (e) { wsOut.textContent += '\n' + e.data; };
    ws.onclose = function (e) { wsOut.textContent += '\nclosed (' + e.code + ')'; };
    document.getElementById('send').onclick = function () { ws.send(document.getElementById('msg').value); };

    document.getElementById('logout').onclick = function () {
      fetch('/_gate/logout', { method: 'POST' }).then(function () { statusOut.textContent = 'logged out'; });
    };
  </script>
</body>
</html>
